mysql.driver=com.mysql.cj.jdbc.Driver
mysql.url=jdbc:mysql://127.0.0.1:3306/gomatch?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
mysql.username=${GOMATCH_DB_USERNAME}
mysql.password=${GOMATCH_DB_PASSWORD}
mysql.pool.maxSize=20
mysql.pool.minIdle=5
mysql.pool.timeout=30000
mysql.pool.idleTimeout=600000
mysql.pool.maxLifetime=1800000

redis.host=localhost
redis.port=6379
redis.password=${GOMATCH_REDIS_PASSWORD}
redis.timeout=3000
redis.database=0

file.storage.path=data/game_saves
file.storage.url.prefix=game://localhost/v1/

oss.endpoint=https://oss-cn-beijing.aliyuncs.com
oss.bucket=gomatch-storage
oss.access-key-id=${OSS_ACCESS_KEY_ID}
oss.access-key-secret=${OSS_ACCESS_KEY_SECRET}

oss.avatar-max-size=2097152
oss.music-max-size=10485760
