name: 发布版本

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'MSI 版本，例如 1.2.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-client:
    runs-on: windows-2022
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 安装 WiX Toolset 3
        shell: powershell
        run: choco upgrade wixtoolset --no-progress --yes

      - name: 确定发布版本
        id: version
        shell: powershell
        run: |
          $version = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}'.TrimStart('v') } else { '${{ inputs.version }}' }
          if ($version -notmatch '^\d+\.\d+\.\d+(-[\w.]+)?$') { throw "无效版本：$version" }
          "value=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: 构建服务端与客户端 JAR
        shell: powershell
        run: mvn package -pl server,client -am -DskipTests --no-transfer-progress

      - name: 打包服务端 JAR
        id: server-jar
        shell: powershell
        run: |
          $jar = Get-ChildItem -Path server/target -Filter "gomatch-server-*.jar" |
            Where-Object { $_.Name -notmatch 'original' } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $jar) { throw "未找到服务端 JAR" }
          "path=$($jar.FullName -replace '\\', '/')" >> $env:GITHUB_OUTPUT
          "name=$($jar.Name)" >> $env:GITHUB_OUTPUT

      - name: 打包客户端 JAR
        id: client-jar
        shell: powershell
        run: |
          $jar = Get-ChildItem -Path client/target -Filter "gomatch-client-*.jar" |
            Where-Object { $_.Name -notmatch 'original' } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $jar) { throw "未找到客户端 JAR" }
          "path=$($jar.FullName -replace '\\', '/')" >> $env:GITHUB_OUTPUT
          "name=$($jar.Name)" >> $env:GITHUB_OUTPUT

      - name: 构建 MSI
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/package_client_msi.ps1 -Version '${{ steps.version.outputs.value }}'

      - name: 上传 MSI 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Gomatch-${{ steps.version.outputs.tag }}-msi
          path: client/target/installer/*.msi
          if-no-files-found: error

      - name: 上传服务端 JAR 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Gomatch-${{ steps.version.outputs.tag }}-server-jar
          path: ${{ steps.server-jar.outputs.path }}
          if-no-files-found: error

      - name: 上传客户端 JAR 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Gomatch-${{ steps.version.outputs.tag }}-client-jar
          path: ${{ steps.client-jar.outputs.path }}
          if-no-files-found: error

      - name: 检查版本说明
        id: notes
        if: github.ref_type == 'tag'
        shell: powershell
        run: |
          $path = "docs/releases/${{ github.ref_name }}.md"
          if (Test-Path $path) {
            "has_file=true" >> $env:GITHUB_OUTPUT
            "path=$path" >> $env:GITHUB_OUTPUT
          } else {
            "has_file=false" >> $env:GITHUB_OUTPUT
          }

      - name: 依据版本说明创建 Release
        if: github.ref_type == 'tag' && steps.notes.outputs.has_file == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Gomatch ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            client/target/installer/*.msi
            ${{ steps.server-jar.outputs.path }}
            ${{ steps.client-jar.outputs.path }}

      - name: 自动生成说明并创建 Release
        if: github.ref_type == 'tag' && steps.notes.outputs.has_file != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Gomatch ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            client/target/installer/*.msi
            ${{ steps.server-jar.outputs.path }}
            ${{ steps.client-jar.outputs.path }}

  deploy-server:
    needs: build-client
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    steps:
      - name: 检查部署凭据
        id: deploy-ready
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          if [ -n "$SSH_HOST" ] && [ -n "$SSH_USER" ] && [ -n "$SSH_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::跳过 deploy-server：请在仓库 Secrets 中配置 SSH_HOST、SSH_USER、SSH_KEY。"
          fi

      - name: 下载服务端 JAR 产物
        if: steps.deploy-ready.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: Gomatch-${{ needs.build-client.outputs.tag }}-server-jar

      - name: 获取 JAR 文件名
        if: steps.deploy-ready.outputs.enabled == 'true'
        id: jar
        run: echo "name=$(ls gomatch-server-*.jar)" >> $GITHUB_OUTPUT

      - name: 上传 JAR 到服务器
        if: steps.deploy-ready.outputs.enabled == 'true'
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: ${{ steps.jar.outputs.name }}
          target: /opt/gomatch/

      - name: 重启服务端
        if: steps.deploy-ready.outputs.enabled == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /opt/gomatch
            pkill -f gomatch-server || true
            sleep 2
            nohup java -Xmx256m -jar ${{ steps.jar.outputs.name }} > server.log 2>&1 &
            sleep 3
            ps aux | grep java | grep -v grep
            echo "---"
            tail -5 server.log