jdbc.driver=com.mysql.cj.jdbc.Driver
jdbc.url=jdbc:mysql://localhost:3306/gomatch?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8
jdbc.username=${GOMATCH_DB_USERNAME}
jdbc.password=${GOMATCH_DB_PASSWORD}

connection.pool.maxSize=20
connection.pool.minIdle=5
connection.pool.maxLifetime=1800000
connection.pool.idleTimeout=600000
connection.pool.connectionTimeout=30000