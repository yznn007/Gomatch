# ProGuard 混淆规则 for Gomatch client
# 仅重命名标识符，不收缩不优化，保证安全

-dontshrink
-dontoptimize

# 忽略对 JDK / JavaFX 外部模块的 class 缺失警告
-dontwarn
-ignorewarnings

# 保留源文件名与行号，方便线上定位崩溃
-keepattributes SourceFile,LineNumberTable

# 保留所有注解（@FXML 等关键反射标记）
-keepattributes *Annotation*

# === 入口 (JavaFX Application 反射调用 start/stop/init) ===
-keep class com.gomatch.client.ClientMain {
    public static void main(java.lang.String[]);
    public void start(javafx.stage.Stage);
    public void stop();
    public void init();
}

# === FXML 控制器 (FXMLLoader 按全限定名字符串加载) ===
-keep class com.gomatch.client.ui.*Controller {
    public *;
}

# === @FXML 注解的字段和方法 ===
-keepclassmembers class * {
    @javafx.fxml.FXML *;
}

# === NetworkListener 接口 (多态回调) ===
-keep interface com.gomatch.client.network.NetworkListener {
    *;
}

# === ScreenManager 核心框架 ===
-keep class com.gomatch.client.ui.ScreenManager {
    public static *;
}

# === UserSettings: Gson 字段反射 (ConfigManager 持久化) ===
-keep class com.gomatch.client.UserSettings {
    public <fields>;
    <init>();
}

# === AppConfig: 跨 Controller 共享静态方法 ===
-keep class com.gomatch.client.AppConfig {
    public static *;
}

# === I18N 国际化 ===
-keep class com.gomatch.client.I18N {
    public static *;
}

# === 枚举 (Java 标准要求) ===
-keepclassmembers enum * {
    public static **[] values();
    public static ** valueOf(java.lang.String);
}

# === 第三方库内部反射保护 ===
-keep class com.google.gson.** { *; }
-keep class org.json.** { *; }
-keep class ch.qos.logback.** { *; }
-keep class org.slf4j.** { *; }
